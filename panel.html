<!doctype html>
<html><head><meta charset="utf-8"><title>Role UI Diff</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 13px system-ui, sans-serif; margin: 0; }
  header { padding: 8px 10px; border-bottom: 1px solid #8884; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  header h1 { font-size: 14px; margin: 0 auto 0 0; width: 100%; }
  input, select, button { font: inherit; padding: 3px 6px; }
  section { padding: 8px 10px; border-bottom: 1px solid #8882; }
  h3 { margin: 6px 0; font-size: 12px; text-transform: uppercase; color: #888; }
  .only-a { color: #c0640a; } .only-b { color: #0a66c0; }
  .item { padding: 2px 0; }
  .score { font-size: 10px; background: #8883; border-radius: 3px; padding: 0 4px; margin-left: 4px; }
  code { font-size: 11px; color: #888; }
  .flag { background: #d33; color: #fff; border-radius: 3px; padding: 0 5px; font-size: 10px; }
</style></head>
<body>
<header>
  <h1>Role UI Diff</h1>
  <input id="role" placeholder="role label (e.g. admin)" style="flex:1">
  <button id="snap">Snapshot this page</button>
  <select id="roleA"></select><span>vs</span><select id="roleB"></select>
  <button id="diff">Diff</button>
  <button id="export">Export</button><button id="import">Import</button>
  <button id="copy">Copy MD</button>
  <input type="file" id="file" accept="application/json" hidden>
</header>
<div id="out"></div>
<script type="module" src="panel.js"></script>
</body></html>
